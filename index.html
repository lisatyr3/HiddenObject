<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luxury Hidden Object Game</title>
<style>
  :root {
    --gold: #d6a94f;
    --cream: #fff7e8;
    --green: #143d2b;
    --deep: #08251a;
    --card: rgba(255,255,255,.94);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(circle at top, rgba(255,214,140,.22) 0%, transparent 30%),
      linear-gradient(180deg, #234b3b 0%, #0c231b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .game-shell {
    width: min(1100px, 100%);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 24px 80px rgba(0,0,0,.35);
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing: .5px;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill {
    background: var(--card);
    color: #143d2b;
    padding: 9px 14px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    font-weight: 700;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }

  .content {
    display: grid;
    grid-template-columns: 1fr 270px;
    gap: 16px;
  }

  .scene-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    border: 6px solid var(--cream);
    background:
      linear-gradient(180deg, #f4e1c8 0%, #d7b697 100%);
    min-height: 520px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
  }

  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    min-height: 520px;
    background:
      linear-gradient(180deg, rgba(255,235,203,.95) 0%, rgba(219,186,154,.96) 100%);
    overflow:hidden;
  }

  .sun-glow {
    position:absolute;
    right:-10%;
    top:-18%;
    width:55%;
    height:55%;
    background:radial-gradient(circle, rgba(255,214,140,.95) 0%, rgba(255,214,140,.35) 40%, transparent 70%);
    pointer-events:none;
    filter:blur(4px);
  }

  .wall-art {
    position:absolute;
    left:41%;
    top:12%;
    width:18%;
    height:18%;
    background:#f9f3ea;
    border:8px solid #a16c43;
    border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.15);
  }

  .wall-art:before {
    content:"🌿";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
  }

  .curtain {
    position:absolute;
    width:10%;
    height:40%;
    top:4%;
    background:linear-gradient(90deg,#d8b48d,#f5e3cb);
    border-radius:0 0 40px 40px;
    opacity:.92;
  }

  .curtain.left { left:5%; }
  .curtain.right { left:25%; }

  .fireplace {
    position:absolute;
    left:72%;
    bottom:14%;
    width:18%;
    height:28%;
    background:#f3eadf;
    border-radius:8px 8px 0 0;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
  }

  .fireplace:before {
    content:"";
    position:absolute;
    left:15%;
    right:15%;
    bottom:8%;
    height:48%;
    background:linear-gradient(180deg,#4a2c1f,#16110f);
    border-radius:6px;
  }

  .fire {
    position:absolute;
    left:34%;
    bottom:20%;
    font-size:46px;
  }

  .coffee-table-book {
    position:absolute;
    left:49%;
    top:67%;
    width:12%;
    height:3%;
    background:#f5f1ea;
    border-radius:3px;
    transform:rotate(-6deg);
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }

  .throw-pillow {
    position:absolute;
    width:9%;
    height:12%;
    background:#f3dcb2;
    border-radius:18px;
    top:49%;
    left:44%;
    transform:rotate(-8deg);
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }

  .throw-pillow.two {
    left:57%;
    background:#d7b57f;
    transform:rotate(10deg);
  }

  .cat {
    position:absolute;
    left:74%;
    bottom:9%;
    font-size:60px;
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.3));
  }

  /* Cozy room illustration made in CSS so the demo works without images */
  .window {
    position: absolute; left: 8%; top: 8%; width: 22%; height: 32%;
    background: linear-gradient(#a9d7ef, #e8f7ff);
    border: 10px solid #fff7e8;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
  }
  .window:before { content:""; position:absolute; left:50%; top:0; bottom:0; width:5px; background:#fff7e8; }
  .window:after { content:""; position:absolute; left:0; right:0; top:50%; height:5px; background:#fff7e8; }

  .rug { position:absolute; left:22%; bottom:3%; width:58%; height:22%; background:#b94a48; border-radius:50%; opacity:.9; }
  .sofa { position:absolute; left:34%; top:43%; width:38%; height:24%; background:#7f9f76; border-radius:30px 30px 14px 14px; box-shadow:0 14px 0 #5d7657; }
  .sofa:before, .sofa:after { content:""; position:absolute; top:28%; width:15%; height:52%; background:#66865f; border-radius:18px; }
  .sofa:before { left:-7%; } .sofa:after { right:-7%; }
  .table { position:absolute; left:41%; top:70%; width:26%; height:8%; background:#835b35; border-radius:12px; box-shadow:0 18px 0 #5e3d22; }
  .plant { position:absolute; right:9%; top:23%; width:11%; height:34%; }
  .plant .pot { position:absolute; left:25%; bottom:0; width:50%; height:28%; background:#a55239; border-radius:0 0 12px 12px; }
  .plant .leaf { position:absolute; background:#2f7a45; border-radius:50% 0 50% 0; width:45%; height:30%; }
  .leaf.l1{ left:10%; top:18%; transform:rotate(-35deg);} .leaf.l2{ right:5%; top:8%; transform:rotate(35deg);} .leaf.l3{ left:30%; top:0; transform:rotate(5deg);} .leaf.l4{ left:20%; top:35%; transform:rotate(-5deg);}
  .shelf { position:absolute; right:7%; top:9%; width:22%; height:6%; background:#80552f; border-radius:6px; box-shadow:0 6px 0 #5d3a20; }
  .book { position:absolute; top:-34px; width:16px; height:34px; background:#c94f4f; border-radius:3px; }
  .book.b2 { left:24px; background:#315e8b; height:28px; top:-28px; } .book.b3{ left:47px; background:#d6a94f; }
  .lamp { position:absolute; left:12%; top:48%; width:13%; height:34%; }
  .shade { position:absolute; left:16%; width:68%; height:28%; background:#fff2c9; clip-path:polygon(20% 0,80% 0,100% 100%,0 100%); }
  .stand { position:absolute; left:47%; top:26%; width:6%; height:55%; background:#5d3a20; } .base { position:absolute; left:28%; bottom:0; width:45%; height:8%; background:#5d3a20; border-radius:50%; }

  .object {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(24px, 3.6vw, 42px);
    cursor: pointer;
    transition: transform .15s, filter .15s, opacity .2s;
    user-select: none;
    text-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .object:hover { transform: translate(-50%, -50%) scale(1.18); filter: drop-shadow(0 0 8px #fff); }
  .object.found { opacity: .18; pointer-events: none; transform: translate(-50%, -50%) scale(.75); }
  .object.hint { animation: pulse 1s infinite; filter: drop-shadow(0 0 12px #facc15); }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.32); } }

  .panel {
    background: var(--card);
    color: #173828;
    border-radius: 22px;
    padding: 18px;
    font-family: Arial, sans-serif;
  }

  .panel h2 { margin: 0 0 10px; font-family: Georgia, serif; font-size: 1.35rem; }
  .list { display: grid; gap: 8px; margin: 14px 0; }
  .item {
    padding: 10px 12px;
    background: #f4ead8;
    border-radius: 12px;
    font-weight: 700;
    display:flex;
    justify-content:space-between;
  }
  .item.done { text-decoration: line-through; opacity:.5; }

  button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 13px 14px;
    margin-top: 9px;
    font-weight: 800;
    cursor: pointer;
    font-size: 1rem;
    background: var(--green);
    color: white;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }

  .win {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .win-card {
    max-width: 430px;
    background: white;
    color: #173828;
    border-radius: 24px;
    padding: 30px;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  @media (max-width: 850px) {
    body { padding: 8px; align-items: flex-start; }
    .game-shell { padding: 12px; }
    .content { grid-template-columns: 1fr; }
    .scene-wrap { min-height: auto; }
    .scene { min-height: 360px; }
    .panel { order: -1; }
    .list { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <h1>Hidden Object: Evening Sunroom</h1>
      <div class="stats">
        <div class="pill">Found: <span id="foundCount">0</span>/8</div>
        <div class="pill">Time: <span id="timer">0:00</span></div>
      </div>
    </div>

    <div class="content">
      <div class="scene-wrap">
        <div class="scene" id="scene">
          <div class="sun-glow"></div>
          <div class="curtain left"></div>
          <div class="curtain right"></div>
          <div class="wall-art"></div>
          <div class="fireplace"><div class="fire">🔥</div></div>
          <div class="cat">🐈</div>
          <div class="throw-pillow"></div>
          <div class="throw-pillow two"></div>
          <div class="coffee-table-book"></div>
          <div class="window"></div>
          <div class="shelf"><div class="book"></div><div class="book b2"></div><div class="book b3"></div></div>
          <div class="lamp"><div class="shade"></div><div class="stand"></div><div class="base"></div></div>
          <div class="plant"><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div><div class="pot"></div></div>
          <div class="rug"></div>
          <div class="sofa"></div>
          <div class="table"></div>
        </div>
      </div>

      <aside class="panel">
        <h2>Find These Items</h2>
        <p>Relax, sip your coffee, and find the hidden treasures tucked around this elegant evening sunroom.</p>
        <div class="list" id="list"></div>
        <button onclick="showHint()">Give Me A Hint</button>
        <button onclick="resetGame()">New Game</button>
      </aside>
    </div>
  </div>

  <div class="win" id="win">
    <div class="win-card">
      <h2>You found everything!</h2>
      <p>Your time was <b id="finalTime"></b>.</p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

<script>
const objects = [
  { name: 'Reading Glasses', icon: '👓', x: 52, y: 73 },
  { name: 'Teacup', icon: '☕', x: 60, y: 66 },
  { name: 'Lipstick', icon: '💄', x: 46, y: 72 },
  { name: 'Scarf', icon: '🧣', x: 38, y: 51 },
  { name: 'Key', icon: '🔑', x: 77, y: 19 },
  { name: 'Flower', icon: '🌸', x: 87, y: 43 },
  { name: 'Shoe', icon: '👠', x: 26, y: 86 },
  { name: 'Envelope', icon: '✉️', x: 17, y: 39 }
];

let found = new Set();
let seconds = 0;
let timerInterval;

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = formatTime(seconds);
  }, 1000);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function renderGame() {
  const scene = document.getElementById('scene');
  document.querySelectorAll('.object').forEach(el => el.remove());
  document.getElementById('list').innerHTML = '';
  found.clear();
  document.getElementById('foundCount').textContent = 0;
  document.getElementById('win').style.display = 'none';
  document.getElementById('timer').textContent = '0:00';

  objects.forEach((obj, index) => {
    const el = document.createElement('div');
    el.className = 'object';
    el.textContent = obj.icon;
    el.style.left = obj.x + '%';
    el.style.top = obj.y + '%';
    el.dataset.index = index;
    el.onclick = () => findObject(index, el);
    scene.appendChild(el);

    const item = document.createElement('div');
    item.className = 'item';
    item.id = 'item-' + index;
    item.innerHTML = `<span>${obj.name}</span><span>○</span>`;
    document.getElementById('list').appendChild(item);
  });

  startTimer();
}

function findObject(index, el) {
  if (found.has(index)) return;
  found.add(index);
  el.classList.remove('hint');
  el.classList.add('found');
  const item = document.getElementById('item-' + index);
  item.classList.add('done');
  item.innerHTML = `<span>${objects[index].name}</span><span>✓</span>`;
  document.getElementById('foundCount').textContent = found.size;

  if (found.size === objects.length) {
    clearInterval(timerInterval);
    document.getElementById('finalTime').textContent = formatTime(seconds);
    document.getElementById('win').style.display = 'flex';
  }
}

function showHint() {
  document.querySelectorAll('.object').forEach(el => el.classList.remove('hint'));
  const remaining = objects.map((_, i) => i).filter(i => !found.has(i));
  if (!remaining.length) return;
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  document.querySelector(`.object[data-index="${pick}"]`).classList.add('hint');
}

function resetGame() {
  renderGame();
}

renderGame();
</script>
</body>
</html>
